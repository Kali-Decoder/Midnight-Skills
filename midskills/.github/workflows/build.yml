name: Build UI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: Read registry pin
        id: pin
        run: |
          VERSION=$(tr -d '[:space:]' < registry-version.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout skills registry
        uses: actions/checkout@v4
        with:
          repository: Kali-Decoder/Midnight-skills
          ref: ${{ steps.pin.outputs.version == 'local' && 'main' || steps.pin.outputs.version }}
          path: .registry-source

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch registry
        run: |
          if [ "${{ steps.pin.outputs.version }}" = "local" ]; then
            pnpm fetch:registry -- --local .registry-source
          else
            pnpm fetch:registry || pnpm fetch:registry -- --local .registry-source
          fi

      - name: Build
        run: pnpm build
        env:
          GITHUB_CLIENT_ID: ci-placeholder
          GITHUB_CLIENT_SECRET: ci-placeholder
          SESSION_SECRET: ci-placeholder-session-secret-min-32-chars
          APP_BASE_URL: http://localhost:3000
