<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browse Skills — MIDSKILLS</title>
<meta name="description" content="Browse Midnight Network developer skills for AI agents.">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/skill.css">
</head>
<body class="page-skill" data-nav-active="skills" data-site-footer="on">

<div class="header">
  <span class="page-title" id="skill-title">Browse Skills</span>
  <button class="copy-btn" id="copy-btn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> <span id="copy-label">Copy skill URL</span></button>
</div>

<div class="skill-main">
  <aside class="sidebar-wrap">
    <div class="sidebar-search">
      <input type="search" id="skill-search" placeholder="Search skills…" autocomplete="off" aria-label="Search skills">
    </div>
    <div class="category-filters" id="category-filters" role="tablist" aria-label="Filter by category"></div>
    <nav class="sidebar" id="sidebar" aria-label="Skills"></nav>
  </aside>
  <article class="skill-content" id="content">
    <p class="loading">Select a skill to read its documentation.</p>
  </article>
</div>

<script src="/site.js"></script>
<script src="/analytics.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<script>
try { window.MidnightAnalytics.track("page_view", { meta: { page: "skill" } }); } catch {}
try { window.MidnightAnalytics.ensureGithubUsername(); } catch {}

const CATEGORY_LABELS = {
  all: 'All',
  foundation: 'Foundation',
  wallet: 'Wallet',
  sdk: 'SDK',
  domain: 'Domain',
  template: 'Templates',
};

const sidebar = document.getElementById('sidebar');
const content = document.getElementById('content');
const titleEl = document.getElementById('skill-title');
const copyBtn = document.getElementById('copy-btn');
const copyLabel = document.getElementById('copy-label');
const categoryFiltersEl = document.getElementById('category-filters');
const searchInput = document.getElementById('skill-search');

let SKILLS = [];
let activeCategory = 'all';
let searchQuery = '';

marked.setOptions({
  gfm: true,
  breaks: false,
});

async function loadRegistry() {
  const res = await fetch('/skills.json');
  if (!res.ok) throw new Error('Failed to load skills.json');
  const data = await res.json();
  SKILLS = (data.skills || [])
    .filter((s) => s.enabled !== false && s.listInRouter !== false && s.id !== 'midnightskill')
    .map((s) => ({
      id: s.id,
      name: s.name,
      path: s.path,
      desc: s.description,
      category: s.category || 'domain',
    }))
    .sort((a, b) => a.name.localeCompare(b.name, 'en'));
  return data;
}

function getFilteredSkills() {
  return SKILLS.filter((skill) => {
    if (activeCategory !== 'all' && skill.category !== activeCategory) return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      return (
        skill.name.toLowerCase().includes(q) ||
        skill.id.toLowerCase().includes(q) ||
        skill.desc.toLowerCase().includes(q)
      );
    }
    return true;
  });
}

function buildCategoryFilters() {
  const categories = ['all', ...new Set(SKILLS.map((s) => s.category))].sort((a, b) => {
    if (a === 'all') return -1;
    if (b === 'all') return 1;
    return (CATEGORY_LABELS[a] || a).localeCompare(CATEGORY_LABELS[b] || b, 'en');
  });

  categoryFiltersEl.innerHTML = '';
  categories.forEach((cat) => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'category-chip' + (cat === activeCategory ? ' active' : '');
    chip.textContent = CATEGORY_LABELS[cat] || cat;
    chip.dataset.category = cat;
    chip.addEventListener('click', () => {
      activeCategory = cat;
      buildCategoryFilters();
      buildSidebar();
    });
    categoryFiltersEl.appendChild(chip);
  });
}

function buildSidebar() {
  const filtered = getFilteredSkills();
  sidebar.innerHTML = '';

  if (!filtered.length) {
    sidebar.innerHTML = '<p class="loading" style="padding: 1rem;">No skills match your filter.</p>';
    return;
  }

  filtered.forEach((skill) => {
    const item = document.createElement('a');
    item.className = 'sidebar-item';
    item.href = 'skill.html?name=' + skill.id;
    item.dataset.skill = skill.id;
    item.innerHTML =
      '<div class="sidebar-item-name">' + escHtml(skill.name) + '</div>' +
      '<div class="sidebar-item-desc">' + escHtml(skill.desc) + '</div>' +
      '<span class="sidebar-item-cat">' + escHtml(CATEGORY_LABELS[skill.category] || skill.category) + '</span>';
    item.addEventListener('click', (e) => {
      e.preventDefault();
      loadSkill(skill.id);
      history.pushState(null, '', 'skill.html?name=' + skill.id);
    });
    sidebar.appendChild(item);
  });

  const params = new URLSearchParams(window.location.search);
  const current = params.get('name');
  document.querySelectorAll('.sidebar-item').forEach((el) => {
    el.classList.toggle('active', el.dataset.skill === current);
  });
}

searchInput.addEventListener('input', () => {
  searchQuery = searchInput.value.trim();
  buildSidebar();
});

async function initSkillsPage() {
  try {
    await loadRegistry();
    buildCategoryFilters();
    buildSidebar();
    const params = new URLSearchParams(window.location.search);
    const initial = params.get('name');
    if (initial && SKILLS.find((s) => s.id === initial)) {
      loadSkill(initial);
    } else if (SKILLS.length) {
      loadSkill(SKILLS[0].id);
      history.replaceState(null, '', 'skill.html?name=' + SKILLS[0].id);
    }
  } catch (err) {
    content.innerHTML = '<p class="error">Could not load skill registry.</p>';
    console.error(err);
  }
}

function loadSkill(id) {
  const skill = SKILLS.find((s) => s.id === id);
  if (!skill) return;

  let anonId = null;
  try { anonId = window.MidnightAnalytics.getAnonId(); } catch {}
  let gh = null;
  try { gh = window.MidnightAnalytics.getGithubUsername(); } catch {}

  document.title = skill.name + ' — MIDSKILLS';
  titleEl.textContent = skill.name;
  copyLabel.textContent = 'Copy skill URL';

  document.querySelectorAll('.sidebar-item').forEach((el) => {
    el.classList.toggle('active', el.dataset.skill === id);
  });

  content.innerHTML = '<p class="loading">Loading…</p>';
  try { window.MidnightAnalytics.track('skill_view', { skill_name: id }); } catch {}

  fetchSkillMarkdown(skill, id, anonId, gh)
    .then((text) => {
      content.innerHTML = renderMarkdown(text);
      content.scrollTop = 0;
    })
    .catch((err) => {
      content.innerHTML = '<p class="error">Could not load skill: ' + escHtml(err.message) + '.</p>';
    });
}

async function fetchSkillMarkdown(skill, id, anonId, gh) {
  const staticUrl = '/' + String(skill.path).replace(/^\//, '');
  const apiUrl =
    '/api/skill?name=' + encodeURIComponent(id) +
    (anonId ? '&anon_id=' + encodeURIComponent(anonId) : '') +
    (gh ? '&github_username=' + encodeURIComponent(gh) : '');

  for (const url of [staticUrl, apiUrl]) {
    try {
      const res = await fetch(url);
      if (!res.ok) continue;
      const text = await res.text();
      if (text && text.trim() && text.trim() !== 'Skill not found') return text;
    } catch {
      /* try next source */
    }
  }
  throw new Error('Skill content not found');
}

{
  const origHTML = copyBtn.innerHTML;
  let timer;
  copyBtn.addEventListener('click', async () => {
    try { await window.MidnightAnalytics.ensureGithubUsername({ force: true }); } catch {}
    const params = new URLSearchParams(window.location.search);
    const name = params.get('name');
    if (!name) return;
    const skill = SKILLS.find((s) => s.id === name);
    if (!skill) return;
    const url = window.location.origin + '/' + String(skill.path).replace(/^\//, '');
    try { window.MidnightAnalytics.track('copy_skill_url', { skill_name: name }); } catch {}
    try {
      await navigator.clipboard.writeText(url);
    } catch {
      const t = document.createElement('textarea');
      t.value = url;
      document.body.appendChild(t);
      t.select();
      document.execCommand('copy');
      document.body.removeChild(t);
    }
    clearTimeout(timer);
    copyBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Copied!';
    timer = setTimeout(() => { copyBtn.innerHTML = origHTML; }, 1500);
  });
}

window.addEventListener('popstate', () => {
  const params = new URLSearchParams(window.location.search);
  const name = params.get('name');
  if (name && SKILLS.find((s) => s.id === name)) loadSkill(name);
});

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function stripFrontmatter(md) {
  if (!md || typeof md !== 'string') return '';
  let raw = md.replace(/\r\n?/g, '\n');
  if (raw.startsWith('---\n')) {
    const end = raw.indexOf('\n---', 4);
    if (end !== -1) raw = raw.slice(end + 4).replace(/^\n+/, '');
  }
  return raw;
}

function renderMarkdown(md) {
  const source = stripFrontmatter(md);
  if (!source.trim()) throw new Error('Empty skill content');

  const renderer = new marked.Renderer();
  renderer.code = function (token) {
    const text = (token && typeof token === 'object' ? token.text : token) || '';
    const lang = (token && typeof token === 'object' ? token.lang : arguments[1]) || '';
    const language = String(lang).trim();
    let highlighted;
    if (language && hljs.getLanguage(language)) {
      highlighted = hljs.highlight(text, { language }).value;
    } else {
      highlighted = hljs.highlightAuto(text).value;
    }
    const langClass = language ? ' language-' + language : '';
    return '<pre><code class="hljs' + langClass + '">' + highlighted + '</code></pre>';
  };
  return marked.parse(source, { renderer });
}

initSkillsPage();
</script>
</body>
</html>
